*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}button,input,select,textarea{font:inherit}.app{max-width:1240px;margin:auto;min-height:100vh}.top{position:sticky;top:0;z-index:30;height:68px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;background:rgba(23,26,31,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.brand{font-size:23px;font-weight:850}.brand small{display:block;color:var(--muted);font-size:10px;font-weight:500}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:13px;padding:9px 12px;cursor:pointer}.layout{display:grid;grid-template-columns:250px 1fr;gap:16px;padding:16px}.side{position:sticky;top:84px;height:calc(100vh - 100px);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:10px;box-shadow:var(--shadow)}.nav button{width:100%;text-align:right;border:0;background:transparent;color:#526071;padding:12px;border-radius:12px;margin:2px 0}.nav button.active,.nav button:hover{background:#24344b;color:#9bc0f5}.main{min-width:0}.page{display:none}.page.active{display:block}.month{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.hero{padding:18px;border-radius:22px;background:linear-gradient(135deg,#1d2b3d,#1c302b);border:1px solid #2b3b42;display:flex;justify-content:space-between;gap:12px}.hero h2{margin:0 0 5px}.hero p{margin:0;color:#9aabb0}.status{padding:8px 12px;border-radius:99px;height:max-content;font-weight:750;font-size:12px}.comfortable{background:#193b30;color:#8bd9b4}.attention{background:#3a3020;color:#e6bd72}.pressure{background:#40252a;color:#ee919a}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:var(--shadow)}.label{font-size:11px;color:var(--muted)}.value{font-size:22px;font-weight:850;margin-top:7px}.section{margin-top:18px}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}.sectionhead h3{margin:0}.link{border:0;background:transparent;color:var(--blue);cursor:pointer}.goals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.goal{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:14px}.progress{height:7px;background:#2a333d;border-radius:99px;overflow:hidden;margin:9px 0}.progress i{display:block;height:100%;background:var(--green)}small{color:var(--muted)}.list{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}.row{display:grid;grid-template-columns:1fr auto auto;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line);align-items:center}.row:last-child{border:0}.amt{font-weight:800}.pill{padding:5px 8px;background:#252e38;border-radius:99px;font-size:10px;color:#a0adbb}.mini{border:0;background:transparent;color:var(--blue);cursor:pointer;padding:5px}.danger{color:var(--red)}.fab{position:fixed;left:22px;bottom:22px;width:60px;height:60px;border:0;border-radius:50%;background:var(--blue);color:#fff;font-size:31px;font-weight:800;box-shadow:0 12px 30px rgba(49,107,214,.3);z-index:25}.overlay,.drawerBackdrop{display:none;position:fixed;inset:0;background:rgba(15,23,34,.48);z-index:40}.overlay.show{display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(680px,100%);max-height:91vh;overflow:auto;background:var(--panel);border-radius:25px 25px 0 0;padding:19px}.quickTypes{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.quickTypes button{padding:15px 8px;border:1px solid var(--line);background:var(--panel2);border-radius:14px;color:var(--text);cursor:pointer}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:11px;color:var(--muted)}.field input,.field select,.field textarea{padding:12px;border-radius:12px;border:1px solid var(--line);background:#191d22;color:var(--text)}.actions{display:flex;gap:9px;margin-top:15px}.primary{flex:1;background:var(--blue);color:#fff;border:0;border-radius:13px;padding:12px;font-weight:800}.secondary{background:#252e38;color:var(--text);border:0;border-radius:13px;padding:12px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{min-height:82px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px}.dot{margin-top:6px;font-size:9px;padding:3px 5px;border-radius:6px;background:#24303f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.settings{display:grid;gap:10px}.setting{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px}.empty{padding:25px;text-align:center;color:var(--muted)}.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-20px);opacity:0;background:#e9eef5;color:#151a21;padding:10px 16px;border-radius:12px;z-index:80;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.drawer{position:fixed;top:0;right:-290px;width:280px;height:100%;background:#20242a;z-index:50;padding:80px 12px 15px;transition:.22s;box-shadow:-12px 0 30px rgba(0,0,0,.12)}.drawer.show{right:0}.drawerBackdrop.show{display:block;z-index:45}.hint{padding:11px 13px;border-radius:12px;background:#1d2a3a;color:#9db6d1;font-size:12px;margin-bottom:12px}
@media(max-width:800px){.layout{display:block;padding:11px}.side{display:none}.grid{grid-template-columns:1fr 1fr}.goals{grid-template-columns:1fr}.form{grid-template-columns:1fr}.quickTypes{grid-template-columns:1fr 1fr}.calendar{gap:3px}.day{min-height:60px;padding:5px}.row{grid-template-columns:1fr auto}.pill{display:none}}
</style></head>
<body>
<div class="app"><header class="top"><button class="btn" id="menuBtn">☰</button><div class="brand">مالي <small>مساعدك المالي الشخصي</small></div><button class="btn" id="bellBtn">🔔</button></header>
<div class="layout"><aside class="side"><nav class="nav" id="nav"></nav></aside><main class="main">
<section id="home" class="page active"><div class="month"><button class="btn" id="nextBtn">‹</button><strong id="monthLabel"></strong><button class="btn" id="prevBtn">›</button></div><div class="hero"><div><h2>مرحبًا بك 👋</h2><small>وضعك المالي لهذا الشهر</small><p id="heroText"></p></div><span id="status" class="status comfortable">ابدأ التسجيل</span></div><div class="grid"><div class="card"><div class="label">المتاح للصرف</div><div class="value" id="available"></div></div><div class="card"><div class="label">الدخل</div><div class="value" id="income"></div></div><div class="card"><div class="label">المصروف والمدفوعات</div><div class="value" id="spent"></div></div><div class="card"><div class="label">الأقساط المؤقتة المتبقية</div><div class="value" id="debt"></div></div><div class="card"><div class="label">مصروفي الشخصي</div><div class="value" id="personalBudget"></div><small id="personalRemain"></small></div><div class="card"><div class="label">الفائض الحالي</div><div class="value" id="surplus"></div></div></div><div class="section"><div class="sectionhead"><h3>قراءة سريعة</h3></div><div class="card" id="alertBox"></div></div><div class="section"><div class="sectionhead"><h3>الخزائن والأهداف</h3><button class="link" onclick="chooseType('goal')">+ هدف</button></div><div class="goals" id="goals"></div></div><div class="section"><div class="sectionhead"><h3>آخر الحركات</h3></div><div class="list" id="recent"></div></div></section>
<section id="incomePage" class="page"></section><section id="fixedPage" class="page"></section><section id="variablePage" class="page"></section><section id="debtsPage" class="page"></section><section id="goalsPage" class="page"></section><section id="calendarPage" class="page"></section><section id="reportsPage" class="page"></section><section id="advisorPage" class="page"></section><section id="settingsPage" class="page"></section>
</main></div></div>
<button class="fab" id="fab">+</button><div class="toast" id="toast"></div>
<div class="drawerBackdrop" id="drawerBackdrop"></div><aside class="drawer" id="drawer"><nav class="nav" id="mobileNav"></nav></aside>
<div class="overlay" id="typeOverlay"><div class="sheet"><h3>وش تبي تسجل؟</h3><div class="hint">اختر النوع أولًا، وبعد الحفظ يظهر مباشرة في الرئيسية وفي قسمه.</div><div class="quickTypes" id="quickTypes"></div><div class="actions"><button class="secondary" onclick="closeAll()">إلغاء</button></div></div></div>
<div class="overlay" id="formOverlay"><div class="sheet"><h3 id="formTitle"></h3><div id="formFields" class="form"></div><div class="actions"><button class="secondary" onclick="closeAll()">إلغاء</button><button class="primary" id="saveBtn">حفظ</button></div></div></div>
<script>
const VERSION='5.2.0';
const labels={home:'الرئيسية',incomePage:'الدخل',fixedPage:'المصاريف الثابتة',variablePage:'المصاريف المتغيرة',debtsPage:'الديون والأقساط',goalsPage:'الخزائن والأهداف',calendarPage:'التقويم المالي',reportsPage:'التقارير',advisorPage:'المستشار الذكي',settingsPage:'الإعدادات'};
const typeLabels={income:'💰 دخل',expense:'🧾 مصروف',fixed:'📌 التزام ثابت',debt:'💳 دين / قسط',vault:'🏦 تحويل لخزينة',goal:'🎯 هدف جديد'};
const REAL_SEED={
 version:VERSION,offset:0,
 transactions:[
  {id:'sep-salary',type:'income',name:'الراتب',amount:13780,date:'2026-09-27',incomeKind:'salary',recurring:true},
  {id:'sep-wife',type:'fixed_payment',name:'الزوجة',amount:500,date:'2026-09-27'},
  {id:'sep-mobile',type:'fixed_payment',name:'الجوال',amount:650,date:'2026-09-27'},
  {id:'sep-electric',type:'fixed_payment',name:'الكهرباء',amount:323.63,date:'2026-09-27'},
  {id:'sep-uni',type:'fixed_payment',name:'الجامعة',amount:675,date:'2026-09-27'},
  {id:'sep-tabby193',type:'debt_payment',name:'تابي 193',amount:193,date:'2026-09-27'},
  {id:'sep-tabby222',type:'debt_payment',name:'تابي 222',amount:222,date:'2026-09-27'},
  {id:'sep-tickets',type:'debt_payment',name:'تذاكر',amount:282.51,date:'2026-09-27'},
  {id:'sep-tamara152',type:'debt_payment',name:'تمارا 152',amount:158.48,date:'2026-09-27'},
  {id:'sep-tamara450',type:'debt_payment',name:'تمارا 450',amount:450,date:'2026-09-27'},
  {id:'sep-loans',type:'debt_payment',name:'القروض الآلية',amount:3222.24,date:'2026-09-27'},
  {id:'sep-emergency',type:'vault',goalId:'g-emergency',name:'تحويل للطوارئ',amount:1000,date:'2026-09-27'}
 ],
 fixed:[
  {id:'f-house',name:'البيت',amount:1000,startDate:'2026-09-01',dueDay:27},
  {id:'f-kids',name:'العيال',amount:900,startDate:'2026-09-01',dueDay:27},
  {id:'f-wife',name:'الزوجة',amount:500,startDate:'2026-09-01',dueDay:27},
  {id:'f-mobile',name:'الجوال',amount:500,startDate:'2026-10-01',dueDay:27},
  {id:'f-wife-mobile',name:'جوال الزوجة',amount:150,startDate:'2026-09-01',dueDay:27},
  {id:'f-electric',name:'الكهرباء',amount:480,startDate:'2026-09-01',dueDay:27},
  {id:'f-water',name:'الماء',amount:125,startDate:'2026-09-01',dueDay:27},
  {id:'f-uni',name:'الجامعة',amount:725,startDate:'2026-09-01',dueDay:27}
 ],
 debts:[
  {id:'d1',name:'القرض الرئيسي',total:98000,remaining:98000,monthly:2887.24,dueDate:'2026-10-27',installments:36,category:'bank'},
  {id:'d2',name:'القرض الثاني',total:5000,remaining:5000,monthly:98,dueDate:'2026-10-27',installments:0,category:'bank'},
  {id:'d3',name:'القرض الثالث',total:2880,remaining:2880,monthly:237,dueDate:'2026-10-27',installments:0,category:'bank'},
  {id:'dt193',category:'temporary',name:'تابي',total:579,remaining:386,monthly:193,dueDate:'2026-10-08',installments:2},
  {id:'dtickets',category:'temporary',name:'التذاكر',total:1410,remaining:1127.49,monthly:282.51,dueDate:'2026-10-02',installments:4},
  {id:'dtamara152',category:'temporary',name:'تمارا',total:456,remaining:297.52,monthly:158.48,dueDate:'2026-10-13',installments:2},
  {id:'dac',category:'temporary',name:'المكيف',total:2700,remaining:2700,monthly:450,dueDate:'2026-10-27',installments:6}
 ],
 goals:[
  {id:'g-emergency',name:'الطوارئ',target:15000,initial:0,targetDate:'',monthlyContribution:1000},
  {id:'g-istanbul',name:'السفر',target:12000,initial:0,targetDate:''},
  {id:'g-majlis',name:'المجلس النسائي',target:3500,initial:0,targetDate:''},
  {id:'g-ramadan',name:'رمضان والعيد',target:2000,initial:0,targetDate:''},
  {id:'g-adha',name:'الأضحية',target:2000,initial:0,targetDate:''}
 ],
 settings:{salaryDay:27,hijri:false,notifications:true,personalBudget:1800},fixedActuals:{}
};
const blank=REAL_SEED;
function load(){try{
 const v4=JSON.parse(localStorage.getItem('mali-v4'));
 if(v4){v4.version=VERSION;v4.fixedActuals=v4.fixedActuals||{};v4.settings={salaryDay:27,hijri:false,notifications:true,personalBudget:1800,...(v4.settings||{})};v4.debts=(v4.debts||[]).map(d=>({...d,category:d.category||( ['d1','d2','d3'].includes(d.id)?'bank':'temporary')}));v4.goals=(v4.goals||[]).filter(g=>g.id!=='g-house').map(g=>g.id==='g-emergency'?{...g,monthlyContribution:g.monthlyContribution||1000}:g);return v4;}
 return structuredClone(REAL_SEED);
}catch(e){return structuredClone(REAL_SEED)}}
let state=load(), currentType=null, editRef=null;
const $=id=>document.getElementById(id), fmt=n=>new Intl.NumberFormat('ar-SA',{maximumFractionDigits:2}).format(Number(n)||0)+' ر.س';
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function monthDate(){let d=new Date();d.setDate(1);d.setMonth(d.getMonth()+state.offset);return d}
function monthKey(){let d=monthDate();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function currentDate(){return new Date().toISOString().slice(0,10)}
function saveState(msg){localStorage.setItem('mali-v4',JSON.stringify(state));render();if(msg)toast(msg)}
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function appliesDate(date){return (date||'').startsWith(monthKey())}
function recurringApplies(x){if(!x.startDate)return true; return monthKey()>=x.startDate.slice(0,7)}
function goalBalance(id){let g=state.goals.find(x=>x.id===id);return (g?.initial||0)+state.transactions.filter(x=>x.type==='vault'&&x.goalId===id).reduce((s,x)=>s+x.amount,0)}
function totals(){
 const tx=state.transactions.filter(x=>appliesDate(x.date));
 const income=tx.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0);
 const expenses=tx.filter(x=>['expense','fixed_payment','debt_payment','vault'].includes(x.type)).reduce((s,x)=>s+x.amount,0);
 const debt=state.debts.filter(x=>x.category!=='bank').reduce((s,x)=>s+Math.max(0,x.remaining),0);
 const upcomingFixed=state.fixed.filter(recurringApplies).reduce((s,x)=>s+x.amount,0);
 const upcomingDebt=state.debts.filter(x=>x.category!=='bank'&&x.monthly>0&&x.remaining>0).reduce((s,x)=>s+Math.min(x.monthly,x.remaining),0);
 return {income,expenses,debt,available:income-expenses,upcomingFixed,upcomingDebt,tx}
}
function buildNav(target){target.innerHTML='';Object.entries(labels).forEach(([id,l],i)=>{let b=document.createElement('button');b.textContent=l;b.className=id==='home'?'active':'';b.onclick=()=>show(id);target.appendChild(b)})}
buildNav($('nav'));buildNav($('mobileNav'));
function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.textContent===labels[id]));closeDrawer()}
function render(){
 const t=totals();$('monthLabel').textContent=new Intl.DateTimeFormat('ar-SA',{month:'long',year:'numeric'}).format(monthDate());$('available').textContent=fmt(t.available);$('income').textContent=fmt(t.income);$('spent').textContent=fmt(t.expenses);$('debt').textContent=fmt(t.debt);let pb=state.settings.personalBudget||1800,ps=t.tx.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0);$('personalBudget').textContent=fmt(pb);$('personalRemain').textContent='المتبقي '+fmt(Math.max(0,pb-ps));$('surplus').textContent=fmt(t.available);
 let ratio=t.income?Math.max(0,t.expenses/t.income):0,s=$('status');
 if(!t.income&&!t.expenses){s.className='status attention';s.textContent='ابدأ التسجيل';$('heroText').textContent='أضف دخلك ومصروفاتك من زر +، وستتحدث الأرقام مباشرة.'}
 else{let cls=ratio<.65?'comfortable':ratio<.85?'attention':'pressure';s.className='status '+cls;s.textContent=ratio<.65?'مريح':ratio<.85?'انتبه':'ضغط';$('heroText').textContent=`المصروفات المسجلة تمثل ${Math.round(ratio*100)}٪ من الدخل المسجل لهذا الشهر.`}
 let upcoming=t.upcomingFixed+t.upcomingDebt;
 $('alertBox').textContent=!t.income?'سجل الدخل أولًا حتى أقدر أحسب المتاح والهامش بدقة.':t.available<0?`المصروفات والمدفوعات تجاوزت الدخل بـ ${fmt(Math.abs(t.available))}.`:`المتاح الحالي ${fmt(t.available)}. الالتزامات الشهرية المعرفة في النظام ${fmt(upcoming)} قبل احتساب ما تم دفعه منها.`;
 $('goals').innerHTML=state.goals.length?state.goals.map(g=>{let b=goalBalance(g.id),p=g.target?Math.min(100,Math.round(b/g.target*100)):0;return `<div class="goal"><strong>${esc(g.name)}</strong><div class="progress"><i style="width:${p}%"></i></div><small>${fmt(b)} من ${fmt(g.target)} • ${p}%<br>${g.monthlyContribution?'تحويل شهري '+fmt(g.monthlyContribution)+' • ':''}${g.targetDate?'الهدف '+esc(g.targetDate):'حدد تاريخًا للهدف'}</small></div>`}).join(''):'<div class="empty">ما عندك أهداف حتى الآن. أضف هدف أو خزينة من زر +.</div>';
 $('recent').innerHTML=t.tx.length?t.tx.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10).map(x=>`<div class="row"><div><strong>${esc(x.name)}</strong><br><small>${esc(x.date)}</small></div><div class="amt">${fmt(x.amount)}</div><span class="pill">${typeLabels[x.type]||({'fixed_payment':'دفعة ثابتة','debt_payment':'دفعة قسط'})[x.type]||x.type}</span></div>`).join(''):'<div class="empty">لا توجد حركات في هذا الشهر.</div>';
 renderPages()
}
function actionButtons(kind,id){return `<span><button class="mini" onclick="editItem('${kind}','${id}')">تعديل</button><button class="mini danger" onclick="deleteItem('${kind}','${id}')">حذف</button></span>`}
function fixedActual(id){let k=monthKey(),x=state.fixedActuals?.[k]?.[id];return Number(x||0)}
function setFixedActual(id){let x=state.fixed.find(v=>v.id===id);if(!x)return;let v=prompt('كم كان الصرف الفعلي لهذا البند هذا الشهر؟',fixedActual(id)||x.amount);if(v===null)return;v=Number(v);if(v<0||!Number.isFinite(v))return toast('أدخل مبلغًا صحيحًا');state.fixedActuals=state.fixedActuals||{};state.fixedActuals[monthKey()]=state.fixedActuals[monthKey()]||{};state.fixedActuals[monthKey()][id]=v;saveState('تم حفظ الصرف الفعلي للشهر')}
function fixedVariance(x){let a=fixedActual(x.id);if(!a)return '';let d=x.amount-a;return ` • الفعلي ${fmt(a)} • ${d>=0?'وفر '+fmt(d):'تجاوز '+fmt(Math.abs(d))}`}
function renderPages(){
 const txIncome=state.transactions.filter(x=>x.type==='income'),txExpense=state.transactions.filter(x=>x.type==='expense');
 $('incomePage').innerHTML=pageList('الدخل',txIncome,'income',x=>`${fmt(x.amount)} • ${esc(x.date)}`);
 $('variablePage').innerHTML=pageList('المصاريف المتغيرة',txExpense,'expense',x=>`${fmt(x.amount)} • ${esc(x.date)}`);
 $('fixedPage').innerHTML=`<div class="sectionhead"><h3>المصاريف الثابتة</h3><button class="link" onclick="chooseType('fixed')">+ إضافة</button></div><div class="hint">لكل بند ميزانية مخططة وصرف فعلي مستقل لكل شهر. العجز لا يُسحب من الطوارئ تلقائيًا.</div><div class="list">${state.fixed.map(x=>`<div class="row"><div><strong>${esc(x.name)}</strong><br><small>المخطط ${fmt(x.amount)}${fixedVariance(x)} • يبدأ ${esc(x.startDate)}</small></div>${actionButtons('fixed',x.id)}<span><button class="mini" onclick="setFixedActual('${x.id}')">تسجيل الفعلي</button><button class="mini" onclick="payFixed('${x.id}')">دفع</button></span></div>`).join('')||'<div class="empty">لا توجد مصاريف ثابتة.</div>'}</div>`;
 let tempDebts=state.debts.filter(x=>x.category!=='bank'),bankDebts=state.debts.filter(x=>x.category==='bank'); $('debtsPage').innerHTML=`<div class="sectionhead"><h3>الأقساط المؤقتة</h3><button class="link" onclick="chooseType('debt')">+ إضافة</button></div><div class="hint">هذه هي الديون التي نتابع إغلاقها: تابي، تمارا، التذاكر، المكيف وما يشابهها.</div><div class="list">${tempDebts.map(x=>`<div class="row"><div><strong>${esc(x.name)}</strong><br><small>المتبقي ${fmt(x.remaining)} • القسط ${fmt(x.monthly)} • الاستحقاق ${esc(x.dueDate||'—')}</small></div>${actionButtons('debt',x.id)}<button class="mini" onclick="payDebt('${x.id}')">دفع قسط</button></div>`).join('')||'<div class="empty">لا توجد أقساط مؤقتة.</div>'}</div><div class="section"><div class="sectionhead"><h3>القروض البنكية — مرجعية فقط</h3></div><div class="list">${bankDebts.map(x=>`<div class="row"><div><strong>${esc(x.name)}</strong><br><small>القسط ${fmt(x.monthly)} • لا يدخل في مؤشر الديون المؤقتة</small></div>${actionButtons('debt',x.id)}<span class="pill">مرجعي</span></div>`).join('')}</div></div>`;
 $('goalsPage').innerHTML=`<div class="sectionhead"><h3>الخزائن والأهداف</h3><button class="link" onclick="chooseType('goal')">+ هدف</button></div><div class="list">${state.goals.map(x=>`<div class="row"><div><strong>${esc(x.name)}</strong><br><small>${fmt(goalBalance(x.id))} من ${fmt(x.target)} • ${esc(x.targetDate||'حدد تاريخ الهدف')} ${x.monthlyContribution?'• شهريًا '+fmt(x.monthlyContribution):''}</small></div>${actionButtons('goal',x.id)}<button class="mini" onclick="chooseType('vault','${x.id}')">تحويل</button></div>`).join('')||'<div class="empty">لا توجد أهداف.</div>'}</div>`;
 renderCalendar();let t=totals();
 $('reportsPage').innerHTML=`<div class="sectionhead"><h3>تقرير الشهر</h3></div><div class="grid"><div class="card"><div class="label">الدخل</div><div class="value">${fmt(t.income)}</div></div><div class="card"><div class="label">الخارج</div><div class="value">${fmt(t.expenses)}</div></div><div class="card"><div class="label">المتاح</div><div class="value">${fmt(t.available)}</div></div><div class="card"><div class="label">الدين المتبقي</div><div class="value">${fmt(t.debt)}</div></div></div>`;
 $('advisorPage').innerHTML=`<div class="card"><h3>المستشار الذكي</h3><p>اقرأ وضع الشهر من أرقامك الحالية: الفائض، المصروف الشخصي، الأقساط المؤقتة والأهداف. الربط مع ChatGPT سيكون عبر Backend آمن في المرحلة التالية.</p><div class="hint">المستشار لا يعدّل أو يسدد أي بند تلقائيًا.</div><textarea id="q" style="width:100%;min-height:95px;padding:12px;border:1px solid var(--line);border-radius:12px" placeholder="مثال: كيف وضعي هذا الشهر؟"></textarea><button class="primary" style="margin-top:10px;width:100%" onclick="localAdvice()">حلّل وضعي</button><div id="answer" style="margin-top:14px"></div></div>`;
 $('settingsPage').innerHTML=`<div class="sectionhead"><h3>الإعدادات</h3></div><div class="settings"><div class="setting"><span>مصروفي الشهري</span><input class="btn" type="number" min="0" value="${state.settings.personalBudget||1800}" onchange="state.settings.personalBudget=+this.value;saveState()"></div><div class="setting"><span>دورة الراتب</span><b>27 → 26</b></div><div class="setting"><span>يوم نزول الراتب</span><input class="btn" type="number" min="1" max="31" value="${state.settings.salaryDay}" onchange="state.settings.salaryDay=+this.value;saveState()"></div><div class="setting"><span>التقويم الهجري</span><input type="checkbox" ${state.settings.hijri?'checked':''} onchange="state.settings.hijri=this.checked;saveState()"></div><div class="setting"><span>إصدار التطبيق</span><b>V${VERSION}</b></div><div class="setting"><span>مكان البيانات</span><b>على هذا الجهاز</b></div></div>`
}
function pageList(title,arr,type,sub){return `<div class="sectionhead"><h3>${title}</h3><button class="link" onclick="chooseType('${type}')">+ إضافة</button></div><div class="list">${arr.map(x=>`<div class="row"><div><strong>${esc(x.name)}</strong><br><small>${sub(x)}</small></div>${actionButtons('transaction',x.id)}<span class="pill">${typeLabels[type]}</span></div>`).join('')||'<div class="empty">لا توجد بيانات.</div>'}</div>`}
function renderCalendar(){let d=monthDate(),y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),cells='';for(let i=0;i<first;i++)cells+='<div></div>';for(let n=1;n<=days;n++){let ds=`${y}-${String(m+1).padStart(2,'0')}-${String(n).padStart(2,'0')}`,ev=state.transactions.filter(x=>x.date===ds);cells+=`<div class="day"><b>${n}</b>${ev.slice(0,2).map(x=>`<div class="dot">${esc(x.name)}</div>`).join('')}</div>`}$('calendarPage').innerHTML=`<div class="sectionhead"><h3>التقويم المالي</h3><small>ميلادي${state.settings.hijri?' + عرض هجري في المرحلة التالية':''}</small></div><div class="calendar">${cells}</div>`}
const schemas={
 income:[['name','اسم الدخل','text'],['amount','المبلغ','number'],['date','التاريخ','date'],['incomeKind','النوع','select','راتب|salary,دخل إضافي|extra'],['recurring','يتكرر شهريًا','checkbox']],
 expense:[['name','اسم المصروف','text'],['amount','المبلغ','number'],['date','التاريخ','date'],['notes','ملاحظات','text']],
 fixed:[['name','اسم المصروف الثابت','text'],['amount','المبلغ الشهري','number'],['startDate','يبدأ من','date'],['dueDay','يوم الاستحقاق','number']],
 debt:[['name','اسم الدين / القسط','text'],['total','إجمالي الدين','number'],['remaining','المتبقي','number'],['monthly','القسط الشهري','number'],['dueDate','تاريخ الاستحقاق القادم','date'],['installments','عدد الأقساط المتبقية','number'],['category','التصنيف','select','قسط مؤقت|temporary,قرض بنكي مرجعي|bank']],
 goal:[['name','اسم الهدف / الخزينة','text'],['target','المبلغ المستهدف','number'],['initial','المحفوظ حاليًا','number'],['targetDate','التاريخ المستهدف','date'],['monthlyContribution','التحويل الشهري المخطط','number']],
 vault:[['goalId','الخزينة','goalSelect'],['amount','مبلغ التحويل','number'],['date','التاريخ','date'],['name','وصف التحويل','text']]
};
function fieldHTML(f,val=''){let [id,label,type,opts]=f;if(type==='select')return `<div class="field"><label>${label}</label><select id="f_${id}">${opts.split(',').map(o=>{let [a,b]=o.split('|');return `<option value="${b}" ${val===b?'selected':''}>${a}</option>`}).join('')}</select></div>`;if(type==='goalSelect')return `<div class="field"><label>${label}</label><select id="f_${id}">${state.goals.map(g=>`<option value="${g.id}" ${val===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}</select></div>`;if(type==='checkbox')return `<div class="field"><label>${label}</label><input id="f_${id}" type="checkbox" ${val?'checked':''}></div>`;return `<div class="field"><label>${label}</label><input id="f_${id}" type="${type}" value="${esc(val)}" ${type==='number'?'min="0" step="0.01"':''}></div>`}
function openTypes(){$('typeOverlay').classList.add('show')}
function chooseType(t,presetGoal=''){closeAll();currentType=t;editRef=null;if(t==='vault'&&!state.goals.length){toast('أنشئ هدف أو خزينة أولًا');return}$('formTitle').textContent=typeLabels[t];$('formFields').innerHTML=schemas[t].map(f=>fieldHTML(f,(f[0]==='date'||f[0]==='startDate')?currentDate():(f[0]==='goalId'?presetGoal:''))).join('');$('formOverlay').classList.add('show')}
function closeAll(){$('typeOverlay').classList.remove('show');$('formOverlay').classList.remove('show')}
function readForm(){let o={};for(const f of schemas[currentType]){let el=$('f_'+f[0]);o[f[0]]=f[2]==='checkbox'?el.checked:(f[2]==='number'?Number(el.value||0):el.value.trim())}return o}
function validate(o){if(currentType!=='vault'&&!o.name)return 'اكتب الاسم';if(['income','expense','fixed','vault'].includes(currentType)&&!(o.amount>0))return 'أدخل مبلغ أكبر من صفر';if(currentType==='debt'&&!(o.total>0||o.remaining>0))return 'أدخل قيمة الدين';if(currentType==='goal'&&!(o.target>0))return 'أدخل المبلغ المستهدف';return ''}
$('saveBtn').onclick=()=>{let o=readForm(),err=validate(o);if(err){toast(err);return}
 if(editRef){let arr=editRef.kind==='transaction'?state.transactions:state[editRef.kind+'s'];let i=arr.findIndex(x=>x.id===editRef.id);if(i>=0)arr[i]={...arr[i],...o};saveState('تم حفظ التعديل')}
 else if(currentType==='income'||currentType==='expense'||currentType==='vault'){state.transactions.push({id:uid(),type:currentType,...o}) ;saveState('تم التسجيل وظهر في الرئيسية')}
 else if(currentType==='fixed'){state.fixed.push({id:uid(),...o});saveState('تمت إضافة المصروف الثابت')}
 else if(currentType==='debt'){state.debts.push({id:uid(),category:'temporary',...o,remaining:o.remaining||o.total});saveState('تمت إضافة الدين بدون خصمه من المتاح')}
 else if(currentType==='goal'){state.goals.push({id:uid(),...o});saveState('تم إنشاء الهدف')}
 closeAll()
};
function editItem(kind,id){let arr=kind==='transaction'?state.transactions:state[kind+'s'],x=arr.find(v=>v.id===id);if(!x)return;currentType=kind==='transaction'?x.type:kind;editRef={kind,id};$('formTitle').textContent='تعديل '+(typeLabels[currentType]||'البند');$('formFields').innerHTML=schemas[currentType].map(f=>fieldHTML(f,x[f[0]]??'')).join('');$('formOverlay').classList.add('show')}
function deleteItem(kind,id){if(!confirm('حذف هذا البند؟'))return;let key=kind==='transaction'?'transactions':kind+'s';state[key]=state[key].filter(x=>x.id!==id);if(kind==='goal')state.transactions=state.transactions.filter(x=>x.goalId!==id);saveState('تم الحذف')}
function payFixed(id){let x=state.fixed.find(v=>v.id===id);if(!x)return;state.transactions.push({id:uid(),type:'fixed_payment',fixedId:id,name:x.name,amount:x.amount,date:currentDate()});saveState('تم تسجيل دفع المصروف الثابت')}
function payDebt(id){let x=state.debts.find(v=>v.id===id);if(!x)return;let amt=Number(prompt('كم دفعت من القسط؟',Math.min(x.monthly||x.remaining,x.remaining)));if(!(amt>0))return;amt=Math.min(amt,x.remaining);x.remaining=Math.max(0,x.remaining-amt);if(x.installments>0)x.installments=Math.max(0,x.installments-1);state.transactions.push({id:uid(),type:'debt_payment',debtId:id,name:'دفعة '+x.name,amount:amt,date:currentDate()});saveState('تم تسجيل القسط وتحديث المتبقي')}
function localAdvice(){let t=totals(),msg=!t.income?'ابدأ بتسجيل دخلك لهذا الشهر، وبعدها أقدر أقارن المصروفات بالمتاح.':t.available<0?`عندك عجز حالي ${fmt(Math.abs(t.available))}. راجع المصروفات المسجلة قبل إضافة التزامات جديدة.`:`الفائض الحالي ${fmt(t.available)}، والأقساط المؤقتة المتبقية ${fmt(t.debt)}. مصروفك الشخصي المخطط ${fmt(state.settings.personalBudget||1800)}. هذه قراءة محلية تمهيدًا لربط ChatGPT.`;$('answer').textContent=msg}
function openDrawer(){$('drawer').classList.add('show');$('drawerBackdrop').classList.add('show')}function closeDrawer(){$('drawer').classList.remove('show');$('drawerBackdrop').classList.remove('show')}
$('menuBtn').onclick=openDrawer;$('drawerBackdrop').onclick=closeDrawer;$('fab').onclick=openTypes;$('bellBtn').onclick=()=>toast($('alertBox').textContent);$('prevBtn').onclick=()=>{state.offset--;saveState()};$('nextBtn').onclick=()=>{state.offset++;saveState()};
$('quickTypes').innerHTML=Object.entries(typeLabels).map(([k,v])=>`<button onclick="chooseType('${k}')">${v}</button>`).join('');
render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js?v=52').then(r=>r.update()).catch(()=>{})}
</script></body></html>
