<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c111b"><title>مالي V2</title><link rel="manifest" href="manifest.json">
<style>
:root{--bg:#0c111b;--panel:#121a27;--panel2:#172131;--line:#263247;--text:#edf3fb;--muted:#8fa0b7;--blue:#69a7ff;--green:#54d39a;--amber:#f3c46b;--red:#ff7b87;--purple:#b49cff;--shadow:0 12px 35px rgba(0,0,0,.22)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}button,input,select,textarea{font:inherit}.app{max-width:1220px;margin:auto;min-height:100vh}.top{position:sticky;top:0;z-index:8;height:68px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;background:rgba(12,17,27,.88);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.brand{font-size:23px;font-weight:850}.brand small{display:block;color:var(--muted);font-size:10px;font-weight:500}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:13px;padding:9px 12px;cursor:pointer}.layout{display:grid;grid-template-columns:245px 1fr;gap:16px;padding:16px}.side{position:sticky;top:84px;height:calc(100vh - 100px);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:10px}.nav button{width:100%;text-align:right;border:0;background:transparent;color:#cbd6e6;padding:12px;border-radius:12px;margin:2px 0}.nav button.active,.nav button:hover{background:#1b2a40;color:var(--blue)}.main{min-width:0}.page{display:none}.page.active{display:block}.month{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.hero{padding:18px;border-radius:22px;background:linear-gradient(135deg,#152437,#12231f);border:1px solid #284139;display:flex;justify-content:space-between;gap:12px}.hero h2{margin:0 0 5px}.hero p{margin:0;color:#b8c8c1}.status{padding:8px 12px;border-radius:99px;height:max-content;font-weight:750;font-size:12px}.comfortable{background:#153d30;color:#7be0b2}.attention{background:#4a3a18;color:#ffd47b}.pressure{background:#4b2229;color:#ff9ba4}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:var(--shadow)}.label{font-size:11px;color:var(--muted)}.value{font-size:22px;font-weight:850;margin-top:7px}.section{margin-top:18px}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}.sectionhead h3{margin:0}.link{border:0;background:transparent;color:var(--blue)}.goals{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.goal{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:14px}.progress{height:7px;background:#243044;border-radius:99px;overflow:hidden;margin:9px 0}.progress i{display:block;height:100%;background:var(--green)}small{color:var(--muted)}.list{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}.row{display:grid;grid-template-columns:1fr auto auto;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line);align-items:center}.row:last-child{border:0}.amt{font-weight:800}.pill{padding:5px 8px;background:#1d293a;border-radius:99px;font-size:10px;color:#aebbd0}.fab{position:fixed;left:22px;bottom:22px;width:58px;height:58px;border:0;border-radius:50%;background:var(--blue);color:#08111f;font-size:31px;font-weight:800;box-shadow:0 12px 30px rgba(105,167,255,.3);z-index:10}.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.58);z-index:20;align-items:flex-end;justify-content:center}.overlay.show{display:flex}.sheet{width:min(650px,100%);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:25px 25px 0 0;padding:19px}.types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:15px}.types button{padding:13px 6px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:13px}.types button.on{outline:2px solid var(--blue)}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:11px;color:var(--muted)}.field input,.field select,.field textarea{padding:12px;border-radius:12px;border:1px solid var(--line);background:#0e1622;color:var(--text)}.actions{display:flex;gap:9px;margin-top:15px}.primary{flex:1;background:var(--blue);color:#08111f;border:0;border-radius:13px;padding:12px;font-weight:800}.secondary{background:#202c3e;color:var(--text);border:0;border-radius:13px;padding:12px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{min-height:82px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px}.day b{font-size:12px}.dot{margin-top:6px;font-size:9px;padding:3px 5px;border-radius:6px;background:#24334a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.settings{display:grid;gap:10px}.setting{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px}.advisorbox textarea{width:100%;min-height:100px}.empty{padding:25px;text-align:center;color:var(--muted)}
@media(max-width:800px){.layout{display:block;padding:11px}.side{display:none}.grid{grid-template-columns:1fr 1fr}.goals{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.types{grid-template-columns:1fr 1fr 1fr}.calendar{gap:3px}.day{min-height:60px;padding:5px}.row{grid-template-columns:1fr auto}.pill{display:none}}
</style></head><body>
<div class="app"><header class="top"><button class="btn" id="menu">☰</button><div class="brand">مالي <small>مساعدك المالي الذكي</small></div><button class="btn" id="bell">🔔</button></header><div class="layout"><aside class="side"><nav class="nav" id="nav"></nav></aside><main class="main">
<section id="home" class="page active"><div class="month"><button class="btn" id="next">‹</button><strong id="monthLabel"></strong><button class="btn" id="prev">›</button></div><div class="hero"><div><h2>ميزانية الشهر</h2><p id="heroText"></p></div><span id="status" class="status comfortable">مريح</span></div><div class="grid"><div class="card"><div class="label">المتاح بعد المصروفات</div><div class="value" id="available"></div></div><div class="card"><div class="label">الدخل</div><div class="value" id="income"></div></div><div class="card"><div class="label">المصروف الفعلي</div><div class="value" id="spent"></div></div><div class="card"><div class="label">إجمالي الديون المتبقية</div><div class="value" id="debt"></div></div></div><div class="section"><div class="sectionhead"><h3>تنبيه مالي</h3></div><div class="card" id="alert"></div></div><div class="section"><div class="sectionhead"><h3>الخزائن والأهداف</h3><button class="link" onclick="openAdd('goal')">+ إضافة</button></div><div class="goals" id="goals"></div></div><div class="section"><div class="sectionhead"><h3>الالتزامات والحركات</h3></div><div class="list" id="recent"></div></div></section>
<section id="incomePage" class="page"></section><section id="fixedPage" class="page"></section><section id="variablePage" class="page"></section><section id="debtsPage" class="page"></section><section id="goalsPage" class="page"></section><section id="calendarPage" class="page"></section><section id="reportsPage" class="page"></section><section id="advisorPage" class="page"></section><section id="settingsPage" class="page"></section>
</main></div></div><button class="fab" onclick="openAdd()">+</button>
<div class="overlay" id="overlay"><div class="sheet"><h3>إضافة / تعديل مالي</h3><div class="types" id="types"></div><div class="form"><div class="field"><label>الاسم</label><input id="name"></div><div class="field"><label>المبلغ المخطط</label><input id="planned" type="number"></div><div class="field"><label>المبلغ الفعلي / المحفوظ</label><input id="actual" type="number"></div><div class="field"><label>التاريخ</label><input id="date" type="date"></div><div class="field extra goal"><label>الهدف النهائي</label><input id="target" type="number"></div><div class="field extra debt"><label>المتبقي من الدين</label><input id="remaining" type="number"></div><div class="field"><label>التكرار</label><select id="repeat"><option value="none">مرة واحدة</option><option value="monthly">شهري</option><option value="yearly">سنوي</option></select></div><div class="field"><label>ملاحظات</label><input id="notes"></div></div><div class="actions"><button class="secondary" onclick="closeAdd()">إلغاء</button><button class="primary" id="save">حفظ</button></div></div></div>
<script>
const labels={home:'الرئيسية',incomePage:'الدخل',fixedPage:'المصاريف الثابتة',variablePage:'المصاريف المتغيرة',debtsPage:'الديون والأقساط',goalsPage:'الخزائن والأهداف',calendarPage:'التقويم المالي',reportsPage:'التقارير',advisorPage:'المستشار الذكي',settingsPage:'الإعدادات'};
const seed=[
{type:'income',name:'الراتب',planned:13780,actual:13780,repeat:'monthly'},
{type:'income',name:'حساب المواطن',planned:400,actual:400,repeat:'monthly'},
{type:'fixed',name:'القروض الشهرية',planned:3222.24,actual:0,repeat:'monthly'},
{type:'fixed',name:'الأطفال',planned:900,actual:0,repeat:'monthly'},
{type:'fixed',name:'البيت',planned:1000,actual:0,repeat:'monthly'},
{type:'fixed',name:'الزوجة',planned:500,actual:0,repeat:'monthly'},
{type:'fixed',name:'الجوال',planned:500,actual:0,repeat:'monthly'},
{type:'fixed',name:'جوال الزوجة',planned:150,actual:0,repeat:'monthly'},
{type:'fixed',name:'الكهرباء',planned:480,actual:0,repeat:'monthly'},
{type:'fixed',name:'الماء',planned:125,actual:0,repeat:'monthly'},
{type:'fixed',name:'الجامعة',planned:725,actual:0,repeat:'monthly'},
{type:'goal',name:'الطوارئ',planned:1000,actual:0,target:10000,repeat:'monthly'},
{type:'goal',name:'البيت',planned:1000,actual:0,target:12000,repeat:'monthly'}
];
let state=JSON.parse(localStorage.getItem('mali-v2')||'null')||{items:seed,offset:0,settings:{salaryDay:27,currency:'SAR',hijri:true,notifications:true}};
const fmt=n=>new Intl.NumberFormat('ar-SA',{maximumFractionDigits:0}).format(n||0)+' ر.س'; const nav=document.getElementById('nav');
Object.entries(labels).forEach(([id,l],i)=>{let b=document.createElement('button');b.textContent=l;b.className=i?'':'active';b.onclick=()=>show(id,b);nav.appendChild(b)});
function md(){let d=new Date();d.setDate(1);d.setMonth(d.getMonth()+state.offset);return d} function key(){let d=md();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function applies(x){return x.repeat==='monthly'||!x.date||(x.date||'').startsWith(key())}
function save(){localStorage.setItem('mali-v2',JSON.stringify(state));render()}
function totals(){let a=state.items.filter(applies),inc=a.filter(x=>x.type==='income').reduce((s,x)=>s+(x.actual||x.planned||0),0),out=a.filter(x=>['fixed','expense','debt'].includes(x.type)).reduce((s,x)=>s+(x.actual||0),0),planned=a.filter(x=>['fixed','expense','debt'].includes(x.type)).reduce((s,x)=>s+(x.planned||0),0),debt=state.items.filter(x=>x.type==='debt').reduce((s,x)=>s+(x.remaining||0),0);return{inc,out,planned,debt,available:inc-out}}
function render(){let t=totals(),ratio=t.inc?t.out/t.inc:0;document.getElementById('monthLabel').textContent=new Intl.DateTimeFormat('ar-SA',{month:'long',year:'numeric'}).format(md());available.textContent=fmt(t.available);income.textContent=fmt(t.inc);spent.textContent=fmt(t.out);debt.textContent=fmt(t.debt);let s=document.getElementById('status');s.className='status '+(ratio<.65?'comfortable':ratio<.85?'attention':'pressure');s.textContent=ratio<.65?'مريح':ratio<.85?'انتبه':'ضغط';heroText.textContent=ratio<.65?'المصروف الفعلي المسجل ضمن مستوى مريح حاليًا.':ratio<.85?'اقتربت المصروفات من مستوى يحتاج متابعة.':'المصروف الفعلي مرتفع مقارنة بالدخل المسجل.';alert.textContent=t.planned>t.inc?'الالتزامات المخططة أعلى من الدخل؛ راجع البنود قبل اعتماد الشهر.':`المتبقي من الدخل بعد المصروف الفعلي ${fmt(t.available)}، والالتزامات المخططة للشهر ${fmt(t.planned)}.`;let gs=state.items.filter(x=>x.type==='goal');goals.innerHTML=gs.length?gs.map(g=>{let p=Math.min(100,Math.round((g.actual/(g.target||1))*100));return`<div class="goal"><strong>${g.name}</strong><div class="progress"><i style="width:${p}%"></i></div><small>${fmt(g.actual)} من ${fmt(g.target)} • ${p}%</small></div>`}).join(''):'<div class="empty">لا توجد أهداف</div>';let a=state.items.filter(applies);recent.innerHTML=a.length?a.slice(-12).reverse().map(x=>`<div class="row"><div><strong>${x.name}</strong><br><small>مخطط ${fmt(x.planned)} • فعلي ${fmt(x.actual)}</small></div><div class="amt">${fmt(x.actual||x.planned)}</div><span class="pill">${tn(x.type)}</span></div>`).join(''):'<div class="empty">لا توجد بيانات</div>';renderPages()}
function tn(t){return({income:'دخل',fixed:'ثابت',expense:'متغير',debt:'دين',goal:'هدف'})[t]}
function listPage(id,type){let arr=state.items.filter(x=>x.type===type);document.getElementById(id).innerHTML=`<div class="sectionhead"><h3>${labels[id]}</h3><button class="link" onclick="openAdd('${type}')">+ إضافة</button></div><div class="list">${arr.map(x=>`<div class="row"><div><strong>${x.name}</strong><br><small>المخطط ${fmt(x.planned)} | الفعلي ${fmt(x.actual)}</small></div><div class="amt">${fmt(type==='debt'?(x.remaining||x.planned):x.planned)}</div><span class="pill">${x.repeat==='monthly'?'شهري':'مرة'}</span></div>`).join('')||'<div class="empty">لا توجد بيانات</div>'}</div>`}
function renderPages(){listPage('incomePage','income');listPage('fixedPage','fixed');listPage('variablePage','expense');listPage('debtsPage','debt');listPage('goalsPage','goal');renderCalendar();let t=totals();reportsPage.innerHTML=`<div class="sectionhead"><h3>تقرير الشهر</h3></div><div class="grid"><div class="card"><div class="label">الدخل</div><div class="value">${fmt(t.inc)}</div></div><div class="card"><div class="label">الفعلي</div><div class="value">${fmt(t.out)}</div></div><div class="card"><div class="label">المخطط</div><div class="value">${fmt(t.planned)}</div></div><div class="card"><div class="label">الهامش الحالي</div><div class="value">${fmt(t.available)}</div></div></div>`;advisorPage.innerHTML=`<div class="card advisorbox"><h3>المستشار الذكي</h3><p>جاهز للربط الآمن مع مزود ذكاء اصطناعي. حاليًا يعطيك محرك مالي محلي بدون إرسال بياناتك للخارج.</p><textarea id="q" placeholder="مثال: لو زدت سداد الدين 300 ريال، كيف يتأثر الشهر؟"></textarea><button class="primary" style="margin-top:10px" onclick="localAdvice()">حلّل وضعي</button><div id="answer" style="margin-top:14px;color:#cbd6e6"></div></div>`;settingsPage.innerHTML=`<div class="sectionhead"><h3>الإعدادات</h3></div><div class="settings"><div class="setting"><span>يوم نزول الراتب</span><input class="btn" type="number" min="1" max="31" value="${state.settings.salaryDay}" onchange="state.settings.salaryDay=+this.value;save()"></div><div class="setting"><span>التقويم الهجري</span><input type="checkbox" ${state.settings.hijri?'checked':''} onchange="state.settings.hijri=this.checked;save()"></div><div class="setting"><span>التنبيهات</span><input type="checkbox" ${state.settings.notifications?'checked':''} onchange="state.settings.notifications=this.checked;save()"></div><div class="setting"><span>الوضع</span><b>داكن</b></div></div>`}
function renderCalendar(){let d=md(),y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),cells='';for(let i=0;i<first;i++)cells+='<div></div>';for(let n=1;n<=days;n++){let ds=`${y}-${String(m+1).padStart(2,'0')}-${String(n).padStart(2,'0')}`,ev=state.items.filter(x=>x.date===ds);cells+=`<div class="day"><b>${n}</b>${ev.slice(0,2).map(x=>`<div class="dot">${x.name}</div>`).join('')}</div>`}calendarPage.innerHTML=`<div class="sectionhead"><h3>التقويم المالي</h3><small>ميلادي${state.settings.hijri?' + هجري':''}</small></div><div class="calendar">${cells}</div>`}
function show(id,b){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active')}
let current='expense';const types=['income','fixed','expense','debt','goal'];types.forEach(t=>{let b=document.createElement('button');b.textContent=tn(t);b.onclick=()=>setType(t);document.getElementById('types').appendChild(b)});
function setType(t){current=t;document.querySelectorAll('#types button').forEach((b,i)=>b.classList.toggle('on',types[i]===t));document.querySelectorAll('.extra').forEach(x=>x.style.display='none');document.querySelectorAll('.'+t).forEach(x=>x.style.display='flex')}
function openAdd(t='expense'){setType(t);overlay.classList.add('show');date.value=new Date().toISOString().slice(0,10)}function closeAdd(){overlay.classList.remove('show')}
save.onclick=()=>{if(!name.value.trim()||!(+planned.value||+actual.value))return alert('أدخل الاسم والمبلغ');state.items.push({id:Date.now(),type:current,name:name.value.trim(),planned:+planned.value||0,actual:+actual.value||0,date:date.value,target:+target.value||0,remaining:+remaining.value||0,repeat:repeat.value,notes:notes.value});['name','planned','actual','target','remaining','notes'].forEach(x=>document.getElementById(x).value='');closeAdd();save()}
function localAdvice(){let t=totals(),q=document.getElementById('q').value;document.getElementById('answer').textContent=`قراءة أولية: دخلك المسجل ${fmt(t.inc)}، مصروفك الفعلي ${fmt(t.out)}، والهامش الحالي ${fmt(t.available)}. الربط بالذكاء الاصطناعي في المرحلة التالية سيضيف تحليل السؤال نفسه وسيناريوهات متعددة.`}
prev.onclick=()=>{state.offset--;save()};next.onclick=()=>{state.offset++;save()};bell.onclick=()=>alert(document.getElementById('alert').textContent);menu.onclick=()=>alert('القائمة الجانبية تظهر كاملة على الشاشة الكبيرة؛ نسخة الجوال المنزلقة تأتي مع تحسين الواجهة التالي.');
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
