<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مالي">
<meta name="format-detection" content="telephone=no">
<title>مالي</title>
<link rel="manifest" href="./manifest.json?v=8.3">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Cairo:wght@500;600;700&display=swap">
<link rel="stylesheet" href="./mali9.css?v=10.0.0">
</head>
<body>
<div id="app" class="app">
  <div class="heroBlock">
    <header class="top">
      <div class="hello"><small id="greet"></small><strong id="who"></strong></div>
      <div class="topBtns">
        <button class="iconBtn" id="eyeBtn" aria-label="إخفاء أو إظهار المبالغ"></button>
        <button class="iconBtn" id="modeBtn" aria-label="تبديل المظهر"></button>
        <button class="iconBtn" id="bellBtn" aria-label="التنبيهات"></button>
      </div>
    </header>

    <nav class="cycleBar" aria-label="الدورة">
      <button class="iconBtn" id="prevCycle" aria-label="الدورة السابقة">›</button>
      <button class="cycleName" id="cycleName"></button>
      <button class="iconBtn" id="nextCycle" aria-label="الدورة التالية">‹</button>
    </nav>

    <section class="hero" id="hero" aria-live="polite"></section>
  </div>
  <section id="pending"></section>
  <section class="tasks" id="tasks"></section>
  <section class="wallets" id="wallets"></section>
  <section class="budget" id="budget"></section>
  <section class="insights" id="insights"></section>
  <section class="extras" id="extras"></section>
  <p class="foot" id="foot"></p>
</div>

<nav class="tabbar" id="tabbar" aria-label="التنقل"></nav>

<div class="sheetWrap" id="sheetWrap" aria-hidden="true">
  <div class="backdrop" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="grab"></div>
    <div class="sheetHead"><h2 id="sheetTitle"></h2><button class="iconBtn" data-close aria-label="إغلاق">✕</button></div>
    <div class="sheetBody" id="sheetBody"></div>
  </div>
</div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="backdrop" data-dclose></div>
  <nav class="drawerPanel" aria-label="الأقسام">
    <div class="sheetHead"><h2>التفاصيل</h2><button class="iconBtn" data-dclose aria-label="إغلاق">✕</button></div>
    <div id="drawerList" class="drawerList"></div>
  </nav>
</aside>

<section class="page" id="page" aria-hidden="true">
  <header class="pageHead">
    <button class="iconBtn" id="pageBack" aria-label="رجوع">›</button>
    <div class="pageTitles"><h2 id="pageTitle"></h2><div class="pageNav"><button id="pagePrev" aria-label="الدورة السابقة">›</button><small id="pageCycle"></small><button id="pageNext" aria-label="الدورة التالية">‹</button></div></div>
  </header>
  <div class="pageBody" id="pageBody"></div>
</section>
<div class="toast" id="toast" role="status"></div>

<script src="./mali9-core.js?v=10.0.0"></script>
<script src="./mali9.js?v=10.0.0"></script>
</body>
</html>
