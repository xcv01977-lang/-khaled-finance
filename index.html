<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="مالي">
<title>مالي — مساعدك المالي</title>
<link rel="manifest" href="./manifest.json?v=3">
<style>
:root{--bg:#f5f7fa;--panel:#fff;--panel2:#f0f3f7;--line:#e2e7ee;--text:#18212d;--muted:#778395;--blue:#316bd6;--green:#17875d;--amber:#a66b12;--red:#bb3f4b;--shadow:0 8px 28px rgba(25,38,58,.07)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}button,input,select,textarea{font:inherit}.app{max-width:1240px;margin:auto;min-height:100vh}.top{position:sticky;top:0;z-index:30;height:68px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;background:rgba(245,247,250,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.brand{font-size:23px;font-weight:850}.brand small{display:block;color:var(--muted);font-size:10px;font-weight:500}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:13px;padding:9px 12px;cursor:pointer}.layout{display:grid;grid-template-columns:250px 1fr;gap:16px;padding:16px}.side{position:sticky;top:84px;height:calc(100vh - 100px);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:10px;box-shadow:var(--shadow)}.nav button{width:100%;text-align:right;border:0;background:transparent;color:#526071;padding:12px;border-radius:12px;margin:2px 0}.nav button.active,.nav button:hover{background:#eaf1ff;color:var(--blue)}.main{min-width:0}.page{display:none}.page.active{display:block}.month{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.hero{padding:18px;border-radius:22px;background:linear-gradient(135deg,#eef4ff,#edf8f3);border:1px solid #dbe8e1;display:flex;justify-content:space-between;gap:12px}.hero h2{margin:0 0 5px}.hero p{margin:0;color:#637467}.status{padding:8px 12px;border-radius:99px;height:max-content;font-weight:750;font-size:12px}.comfortable{background:#dff5eb;color:#126c4b}.attention{background:#fff0cf;color:#8a5a0b}.pressure{background:#ffe1e4;color:#a8323d}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:var(--shadow)}.label{font-size:11px;color:var(--muted)}.value{font-size:22px;font-weight:850;margin-top:7px}.section{margin-top:18px}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}.sectionhead h3{margin:0}.link{border:0;background:transparent;color:var(--blue);cursor:pointer}.goals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.goal{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:14px}.progress{height:7px;background:#edf0f4;border-radius:99px;overflow:hidden;margin:9px 0}.progress i{display:block;height:100%;background:var(--green)}small{color:var(--muted)}.list{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}.row{display:grid;grid-template-columns:1fr auto auto;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line);align-items:center}.row:last-child{border:0}.amt{font-weight:800}.pill{padding:5px 8px;background:#edf1f6;border-radius:99px;font-size:10px;color:#667488}.mini{border:0;background:transparent;color:var(--blue);cursor:pointer;padding:5px}.danger{color:var(--red)}.fab{position:fixed;left:22px;bottom:22px;width:60px;height:60px;border:0;border-radius:50%;background:var(--blue);color:#fff;font-size:31px;font-weight:800;box-shadow:0 12px 30px rgba(49,107,214,.3);z-index:25}.overlay,.drawerBackdrop{display:none;position:fixed;inset:0;background:rgba(15,23,34,.48);z-index:40}.overlay.show{display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(680px,100%);max-height:91vh;overflow:auto;background:var(--panel);border-radius:25px 25px 0 0;padding:19px}.quickTypes{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.quickTypes button{padding:15px 8px;border:1px solid var(--line);background:var(--panel2);border-radius:14px;color:var(--text);cursor:pointer}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:11px;color:var(--muted)}.field input,.field select,.field textarea{padding:12px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--text)}.actions{display:flex;gap:9px;margin-top:15px}.primary{flex:1;background:var(--blue);color:#fff;border:0;border-radius:13px;padding:12px;font-weight:800}.secondary{background:#edf1f6;color:var(--text);border:0;border-radius:13px;padding:12px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{min-height:82px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px}.dot{margin-top:6px;font-size:9px;padding:3px 5px;border-radius:6px;background:#edf2fa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.settings{display:grid;gap:10px}.setting{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px}.empty{padding:25px;text-align:center;color:var(--muted)}.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-20px);opacity:0;background:#18212d;color:#fff;padding:10px 16px;border-radius:12px;z-index:80;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.drawer{position:fixed;top:0;right:-290px;width:280px;height:100%;background:#fff;z-index:50;padding:80px 12px 15px;transition:.22s;box-shadow:-12px 0 30px rgba(0,0,0,.12)}.drawer.show{right:0}.drawerBackdrop.show{display:block;z-index:45}.hint{padding:11px 13px;border-radius:12px;background:#f0f5ff;color:#45617f;font-size:12px;margin-bottom:12px}
@media(max-width:800px){.layout{display:block;padding:11px}.side{display:none}.grid{grid-template-columns:1fr 1fr}.goals{grid-template-columns:1fr}.form{grid-template-columns:1fr}.quickTypes{grid-template-columns:1fr 1fr}.calendar{gap:3px}.day{min-height:60px;padding:5px}.row{grid-template-columns:1fr auto}.pill{display:none}}
</style></head>
<body>
<div class="app"><header class="top"><button class="btn" id="menuBtn">☰</button><div class="brand">مالي <small>مساعدك المالي الشخصي</small></div><button class="btn" id="bellBtn">🔔</button></header>
<div class="layout"><aside class="side"><nav class="nav" id="nav"></nav></aside><main class="main">
<section id="home" class="page active"><div class="month"><button class="btn" id="nextBtn">‹</button><strong id="monthLabel"></strong><button class="btn" id="prevBtn">›</button></div><div class="hero"><div><h2>ميزانية الشهر</h2><p id="heroText"></p></div><span id="status" class="status comfortable">ابدأ التسجيل</span></div><div class="grid"><div class="card"><div class="label">المتاح للصرف</div><div class="value" id="available"></div></div><div class="card"><div class="label">الدخل</div><div class="value" id="income"></div></div><div class="card"><div class="label">المصروف والمدفوعات</div><div class="value" id="spent"></div></div><div class="card"><div class="label">الديون المتبقية</div><div class="value" id="debt"></div></div></div><div class="section"><div class="sectionhead"><h3>قراءة سريعة</h3></div><div class="card" id="alertBox"></div></div><div class="section"><div class="sectionhead"><h3>الخزائن والأهداف</h3><button class="link" onclick="chooseType('goal')">+ هدف</button></div><div class="goals" id="goals"></div></div><div class="section"><div class="sectionhead"><h3>آخر الحركات</h3></div><div class="list" id="recent"></div></div></section>
<section id="incomePage" class="page"></section><section id="fixedPage" class="page"></section><section id="variablePage" class="page"></section><section id="debtsPage" class="page"></section><section id="goalsPage" class="page"></section><section id="calendarPage" class="page"></section><section id="reportsPage" class="page"></section><section id="advisorPage" class="page"></section><section id="settingsPage" class="page"></section>
</main></div></div>
<button class="fab" id="fab">+</button><div class="toast" id="toast"></div>
<div class="drawerBackdrop" id="drawerBackdrop"></div><aside class="drawer" id="drawer"><nav class="nav" id="mobileNav"></nav></aside>
<div class="overlay" id="typeOverlay"><div class="sheet"><h3>وش تبي تسجل؟</h3><div class="hint">اختر النوع أولًا، وبعد الحفظ يظهر مباشرة في الرئيسية وفي قسمه.</div><div class="quickTypes" id="quickTypes"></div><div class="actions"><button class="secondary" onclick="closeAll()">إلغاء</button></div></div></div>
<div class="overlay" id="formOverlay"><div class="sheet"><h3 id="formTitle"></h3><div id="formFields" class="form"></div><div class="actions"><button class="secondary" onclick="closeAll()">إلغاء</button><button class="primary" id="saveBtn">حفظ</button></div></div></div>
<script>
const VERSION='3.0.0';
const labels={home:'الرئيسية',incomePage:'الدخل',fixedPage:'المصاريف الثابتة',variablePage:'المصاريف المتغيرة',debtsPage:'الديون والأقساط',goalsPage:'الخزائن والأهداف',calendarPage:'التقويم المالي',reportsPage:'التقارير',advisorPage:'المستشار الذكي',settingsPage:'الإعدادات'};
const typeLabels={income:'دخل',expense:'مصروف',fixed:'مصروف ثابت',debt:'دين / قسط',vault:'تحويل لخزينة',goal:'هدف جديد'};
const blank={version:VERSION,offset:0,transactions:[],fixed:[],debts:[],goals:[],settings:{salaryDay:27,hijri:true,notifications:true}};
function load(){try{const s=JSON.parse(localStorage.getItem('mali-v3'));return s&&s.version?{...blank,...s}:structuredClone(blank)}catch(e){return structuredClone(blank)}}
let state=load(), currentType=null, editRef=null;
const $=id=>document.getElementById(id), fmt=n=>new Intl.NumberFormat('ar-SA',{maximumFractionDigits:2}).format(Number(n)||0)+' ر.س';
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function monthDate(){let d=new Date();d.setDate(1);d.setMonth(d.getMonth()+state.offset);return d}
function monthKey(){let d=monthDate();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function currentDate(){return new Date().toISOString().slice(0,10)}
function saveState(msg){localStorage.setItem('mali-v3',JSON.stringify(state));render();if(msg)toast(msg)}
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function appliesDate(date){return (date||'').startsWith(monthKey())}
function recurringApplies(x){if(!x.startDate)return true; return monthKey()>=x.startDate.slice(0,7)}
function goalBalance(id){let g=state.goals.find(x=>x.id===id);return (g?.initial||0)+state.transactions.filter(x=>x.type==='vault'&&x.goalId===id).reduce((s,x)=>s+x.amount,0)}
function totals(){
 const tx=state.transactions.filter(x=>appliesDate(x.date));
 const income=tx.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0);
 const expenses=tx.filter(x=>['expense','fixed_payment','debt_payment','vault'].includes(x.type)).reduce((s,x)=>s+x.amount,0);
 const debt=state.debts.reduce((s,x)=>s+Math.max(0,x.remaining),0);
 const upcomingFixed=state.fixed.filter(recurringApplies).reduce((s,x)=>s+x.amount,0);
 const upcomingDebt=state.debts.filter(x=>x.monthly>0&&x.remaining>0).reduce((s,x)=>s+Math.min(x.monthly,x.remaining),0);
 return {income,expenses,debt,available:income-expenses,upcomingFixed,upcomingDebt,tx}
}
function buildNav(target){target.innerHTML='';Object.entries(labels).forEach(([id,l],i)=>{let b=document.createElement('button');b.textContent=l;b.className=id==='home'?'active':'';b.onclick=()=>show(id);target.appendChild(b)})}
buildNav($('nav'));buildNav($('mobileNav'));
function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.textContent===labels[id]));closeDrawer()}
function render(){
 const t=totals();$('monthLabel').textContent=new Intl.DateTimeFormat('ar-SA',{month:'long',year:'numeric'}).format(monthDate());$('available').textContent=fmt(t.available);$('income').textContent=fmt(t.income);$('spent').textContent=fmt(t.expenses);$('debt').textContent=fmt(t.debt);
 let ratio=t.income?Math.max(0,t.expenses/t.income):0,s=$('status');
 if(!t.income&&!t.expenses){s.className='status attention';s.textContent='ابدأ التسجيل';$('heroText').textContent='أضف دخلك ومصروفاتك من زر +، وستتحدث الأرقام مباشرة.'}
 else{let cls=ratio<.65?'comfortable':ratio<.85?'attention':'pressure';s.className='status '+cls;s.textContent=ratio<.65?'مريح':ratio<.85?'انتبه':'ضغط';$('heroText').textContent=`المصروفات المسجلة تمثل ${Math.round(ratio*100)}٪ من الدخل المسجل لهذا الشهر.`}
 let upcoming=t.upcomingFixed+t.upcomingDebt;
 $('alertBox').textContent=!t.income?'سجل الدخل أولًا حتى أقدر أحسب المتاح والهامش بدقة.':t.available<0?`المصروفات والمدفوعات تجاوزت الدخل بـ ${fmt(Math.abs(t.available))}.`:`المتاح الحالي ${fmt(t.available)}. الالتزامات الشهرية المعرفة في النظام ${fmt(upcoming)} قبل احتساب ما تم دفعه منها.`;
 $('goals').innerHTML=state.goals.length?state.goals.map(g=>{let b=goalBalance(g.id),p=g.target?Math.min(100,Math.round(b/g.target*100)):0;return `<div class="goal"><strong>${esc(g.name)}</strong><div class="progress"><i style="width:${p}%"></i></div><small>${fmt(b)} من ${fmt(g.target)} • ${p}%</small></div>`}).join(''):'<div class="empty">ما عندك أهداف حتى الآن. أضف هدف أو خزينة من زر +.</div>';
 $('recent').innerHTML=t.tx.length?t.tx.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10).map(x=>`<div class="row"><div><strong>${esc(x.name)}</strong><br><small>${esc(x.date)}</small></div><div class="amt">${fmt(x.amount)}</div><span class="pill">${typeLabels[x.type]||({'fixed_payment':'دفعة ثابتة','debt_payment':'دفعة قسط'})[x.type]||x.type}</span></div>`).join(''):'<div class="empty">لا توجد حركات في هذا الشهر.</div>';
 renderPages()
}
function actionButtons(kind,id){return `<span><button class="mini" onclick="editItem('${kind}','${id}')">تعديل</button><button class="mini danger" onclick="deleteItem('${kind}','${id}')">حذف</button></span>`}
function renderPages(){
 const txIncome=state.transactions.filter(x=>x.type==='income'),txExpense=state.transactions.filter(x=>x.type==='expense');
 $('incomePage').innerHTML=pageList('الدخل',txIncome,'income',x=>`${fmt(x.amount)} • ${esc(x.date)}`);
 $('variablePage').innerHTML=pageList('المصاريف المتغيرة',txExpense,'expense',x=>`${fmt(x.amount)} • ${esc(x.date)}`);
 $('fixedPage').innerHTML=`<div class="sectionhead"><h3>المصاريف الثابتة</h3><button class="link" onclick="chooseType('fixed')">+ إضافة</button></div><div class="list">${state.fixed.map(x=>`<div class="row"><div><strong>${esc(x.name)}</strong><br><small>${fmt(x.amount)} شهريًا • يبدأ ${esc(x.startDate)}</small></div>${actionButtons('fixed',x.id)}<button class="mini" onclick="payFixed('${x.id}')">تسجيل دفع</button></div>`).join('')||'<div class="empty">لا توجد مصاريف ثابتة.</div>'}</div>`;
 $('debtsPage').innerHTML=`<div class="sectionhead"><h3>الديون والأقساط</h3><button class="link" onclick="chooseType('debt')">+ إضافة</button></div><div class="list">${state.debts.map(x=>`<div class="row"><div><strong>${esc(x.name)}</strong><br><small>المتبقي ${fmt(x.remaining)} • القسط ${fmt(x.monthly)} • الاستحقاق ${esc(x.dueDate||'—')}</small></div>${actionButtons('debt',x.id)}<button class="mini" onclick="payDebt('${x.id}')">دفع قسط</button></div>`).join('')||'<div class="empty">لا توجد ديون.</div>'}</div>`;
 $('goalsPage').innerHTML=`<div class="sectionhead"><h3>الخزائن والأهداف</h3><button class="link" onclick="chooseType('goal')">+ هدف</button></div><div class="list">${state.goals.map(x=>`<div class="row"><div><strong>${esc(x.name)}</strong><br><small>${fmt(goalBalance(x.id))} من ${fmt(x.target)} • ${esc(x.targetDate||'بدون تاريخ')}</small></div>${actionButtons('goal',x.id)}<button class="mini" onclick="chooseType('vault','${x.id}')">تحويل</button></div>`).join('')||'<div class="empty">لا توجد أهداف.</div>'}</div>`;
 renderCalendar();let t=totals();
 $('reportsPage').innerHTML=`<div class="sectionhead"><h3>تقرير الشهر</h3></div><div class="grid"><div class="card"><div class="label">الدخل</div><div class="value">${fmt(t.income)}</div></div><div class="card"><div class="label">الخارج</div><div class="value">${fmt(t.expenses)}</div></div><div class="card"><div class="label">المتاح</div><div class="value">${fmt(t.available)}</div></div><div class="card"><div class="label">الدين المتبقي</div><div class="value">${fmt(t.debt)}</div></div></div>`;
 $('advisorPage').innerHTML=`<div class="card"><h3>المستشار الذكي</h3><p>هذه المرحلة تحلل بياناتك محليًا فقط. ربط ذكاء اصطناعي خارجي يحتاج Backend آمن ولا نضع مفتاح API داخل المتصفح.</p><textarea id="q" style="width:100%;min-height:95px;padding:12px;border:1px solid var(--line);border-radius:12px" placeholder="مثال: كيف وضعي هذا الشهر؟"></textarea><button class="primary" style="margin-top:10px;width:100%" onclick="localAdvice()">حلّل وضعي</button><div id="answer" style="margin-top:14px"></div></div>`;
 $('settingsPage').innerHTML=`<div class="sectionhead"><h3>الإعدادات</h3></div><div class="settings"><div class="setting"><span>يوم نزول الراتب</span><input class="btn" type="number" min="1" max="31" value="${state.settings.salaryDay}" onchange="state.settings.salaryDay=+this.value;saveState()"></div><div class="setting"><span>التقويم الهجري</span><input type="checkbox" ${state.settings.hijri?'checked':''} onchange="state.settings.hijri=this.checked;saveState()"></div><div class="setting"><span>إصدار التطبيق</span><b>V${VERSION}</b></div><div class="setting"><span>مكان البيانات</span><b>على هذا الجهاز</b></div></div>`
}
function pageList(title,arr,type,sub){return `<div class="sectionhead"><h3>${title}</h3><button class="link" onclick="chooseType('${type}')">+ إضافة</button></div><div class="list">${arr.map(x=>`<div class="row"><div><strong>${esc(x.name)}</strong><br><small>${sub(x)}</small></div>${actionButtons('transaction',x.id)}<span class="pill">${typeLabels[type]}</span></div>`).join('')||'<div class="empty">لا توجد بيانات.</div>'}</div>`}
function renderCalendar(){let d=monthDate(),y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),cells='';for(let i=0;i<first;i++)cells+='<div></div>';for(let n=1;n<=days;n++){let ds=`${y}-${String(m+1).padStart(2,'0')}-${String(n).padStart(2,'0')}`,ev=state.transactions.filter(x=>x.date===ds);cells+=`<div class="day"><b>${n}</b>${ev.slice(0,2).map(x=>`<div class="dot">${esc(x.name)}</div>`).join('')}</div>`}$('calendarPage').innerHTML=`<div class="sectionhead"><h3>التقويم المالي</h3><small>ميلادي${state.settings.hijri?' + عرض هجري في المرحلة التالية':''}</small></div><div class="calendar">${cells}</div>`}
const schemas={
 income:[['name','اسم الدخل','text'],['amount','المبلغ','number'],['date','التاريخ','date'],['incomeKind','النوع','select','راتب|salary,دخل إضافي|extra'],['recurring','يتكرر شهريًا','checkbox']],
 expense:[['name','اسم المصروف','text'],['amount','المبلغ','number'],['date','التاريخ','date'],['notes','ملاحظات','text']],
 fixed:[['name','اسم المصروف الثابت','text'],['amount','المبلغ الشهري','number'],['startDate','يبدأ من','date'],['dueDay','يوم الاستحقاق','number']],
 debt:[['name','اسم الدين / القسط','text'],['total','إجمالي الدين','number'],['remaining','المتبقي','number'],['monthly','القسط الشهري','number'],['dueDate','تاريخ الاستحقاق القادم','date'],['installments','عدد الأقساط المتبقية','number']],
 goal:[['name','اسم الهدف / الخزينة','text'],['target','المبلغ المستهدف','number'],['initial','المحفوظ حاليًا','number'],['targetDate','التاريخ المستهدف','date']],
 vault:[['goalId','الخزينة','goalSelect'],['amount','مبلغ التحويل','number'],['date','التاريخ','date'],['name','وصف التحويل','text']]
};
function fieldHTML(f,val=''){let [id,label,type,opts]=f;if(type==='select')return `<div class="field"><label>${label}</label><select id="f_${id}">${opts.split(',').map(o=>{let [a,b]=o.split('|');return `<option value="${b}" ${val===b?'selected':''}>${a}</option>`}).join('')}</select></div>`;if(type==='goalSelect')return `<div class="field"><label>${label}</label><select id="f_${id}">${state.goals.map(g=>`<option value="${g.id}" ${val===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}</select></div>`;if(type==='checkbox')return `<div class="field"><label>${label}</label><input id="f_${id}" type="checkbox" ${val?'checked':''}></div>`;return `<div class="field"><label>${label}</label><input id="f_${id}" type="${type}" value="${esc(val)}" ${type==='number'?'min="0" step="0.01"':''}></div>`}
function openTypes(){$('typeOverlay').classList.add('show')}
function chooseType(t,presetGoal=''){closeAll();currentType=t;editRef=null;if(t==='vault'&&!state.goals.length){toast('أنشئ هدف أو خزينة أولًا');return}$('formTitle').textContent=typeLabels[t];$('formFields').innerHTML=schemas[t].map(f=>fieldHTML(f,(f[0]==='date'||f[0]==='startDate')?currentDate():(f[0]==='goalId'?presetGoal:''))).join('');$('formOverlay').classList.add('show')}
function closeAll(){$('typeOverlay').classList.remove('show');$('formOverlay').classList.remove('show')}
function readForm(){let o={};for(const f of schemas[currentType]){let el=$('f_'+f[0]);o[f[0]]=f[2]==='checkbox'?el.checked:(f[2]==='number'?Number(el.value||0):el.value.trim())}return o}
function validate(o){if(currentType!=='vault'&&!o.name)return 'اكتب الاسم';if(['income','expense','fixed','vault'].includes(currentType)&&!(o.amount>0))return 'أدخل مبلغ أكبر من صفر';if(currentType==='debt'&&!(o.total>0||o.remaining>0))return 'أدخل قيمة الدين';if(currentType==='goal'&&!(o.target>0))return 'أدخل المبلغ المستهدف';return ''}
$('saveBtn').onclick=()=>{let o=readForm(),err=validate(o);if(err){toast(err);return}
 if(editRef){let arr=editRef.kind==='transaction'?state.transactions:state[editRef.kind+'s'];let i=arr.findIndex(x=>x.id===editRef.id);if(i>=0)arr[i]={...arr[i],...o};saveState('تم حفظ التعديل')}
 else if(currentType==='income'||currentType==='expense'||currentType==='vault'){state.transactions.push({id:uid(),type:currentType,...o}) ;saveState('تم التسجيل وظهر في الرئيسية')}
 else if(currentType==='fixed'){state.fixed.push({id:uid(),...o});saveState('تمت إضافة المصروف الثابت')}
 else if(currentType==='debt'){state.debts.push({id:uid(),...o,remaining:o.remaining||o.total});saveState('تمت إضافة الدين بدون خصمه من المتاح')}
 else if(currentType==='goal'){state.goals.push({id:uid(),...o});saveState('تم إنشاء الهدف')}
 closeAll()
};
function editItem(kind,id){let arr=kind==='transaction'?state.transactions:state[kind+'s'],x=arr.find(v=>v.id===id);if(!x)return;currentType=kind==='transaction'?x.type:kind;editRef={kind,id};$('formTitle').textContent='تعديل '+(typeLabels[currentType]||'البند');$('formFields').innerHTML=schemas[currentType].map(f=>fieldHTML(f,x[f[0]]??'')).join('');$('formOverlay').classList.add('show')}
function deleteItem(kind,id){if(!confirm('حذف هذا البند؟'))return;let key=kind==='transaction'?'transactions':kind+'s';state[key]=state[key].filter(x=>x.id!==id);if(kind==='goal')state.transactions=state.transactions.filter(x=>x.goalId!==id);saveState('تم الحذف')}
function payFixed(id){let x=state.fixed.find(v=>v.id===id);if(!x)return;state.transactions.push({id:uid(),type:'fixed_payment',fixedId:id,name:x.name,amount:x.amount,date:currentDate()});saveState('تم تسجيل دفع المصروف الثابت')}
function payDebt(id){let x=state.debts.find(v=>v.id===id);if(!x)return;let amt=Number(prompt('كم دفعت من القسط؟',Math.min(x.monthly||x.remaining,x.remaining)));if(!(amt>0))return;amt=Math.min(amt,x.remaining);x.remaining=Math.max(0,x.remaining-amt);if(x.installments>0)x.installments=Math.max(0,x.installments-1);state.transactions.push({id:uid(),type:'debt_payment',debtId:id,name:'دفعة '+x.name,amount:amt,date:currentDate()});saveState('تم تسجيل القسط وتحديث المتبقي')}
function localAdvice(){let t=totals(),msg=!t.income?'ابدأ بتسجيل دخلك لهذا الشهر، وبعدها أقدر أقارن المصروفات بالمتاح.':t.available<0?`عندك عجز حالي ${fmt(Math.abs(t.available))}. راجع المصروفات المسجلة قبل إضافة التزامات جديدة.`:`المتاح الحالي ${fmt(t.available)}، وإجمالي الدين المتبقي ${fmt(t.debt)}. هذه قراءة محلية وليست اتصالًا بذكاء اصطناعي خارجي.`;$('answer').textContent=msg}
function openDrawer(){$('drawer').classList.add('show');$('drawerBackdrop').classList.add('show')}function closeDrawer(){$('drawer').classList.remove('show');$('drawerBackdrop').classList.remove('show')}
$('menuBtn').onclick=openDrawer;$('drawerBackdrop').onclick=closeDrawer;$('fab').onclick=openTypes;$('bellBtn').onclick=()=>toast($('alertBox').textContent);$('prevBtn').onclick=()=>{state.offset--;saveState()};$('nextBtn').onclick=()=>{state.offset++;saveState()};
$('quickTypes').innerHTML=Object.entries(typeLabels).map(([k,v])=>`<button onclick="chooseType('${k}')">${v}</button>`).join('');
render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js?v=3').then(r=>r.update()).catch(()=>{})}
</script></body></html>
