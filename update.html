<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101318"><title>تحديث مالي</title><style>*{box-sizing:border-box}body{margin:0;background:#101318;color:#edf0f4;font-family:Tahoma,Arial,sans-serif;line-height:1.8;padding:24px}.box{max-width:480px;margin:8vh auto;background:#191e25;border:1px solid #303946;border-radius:22px;padding:24px}h1{font-size:23px;margin:0}p{color:#a4afbc;font-size:14px}button,a{display:block;width:100%;padding:14px;margin:10px 0;border:1px solid #45617b;border-radius:13px;font:inherit;text-align:center;cursor:pointer;background:#b7cadd;color:#172330;text-decoration:none}button.secondary{background:#222933;color:#edf0f4}small{display:block;color:#a4afbc}#status{margin-top:18px;font-size:13px;color:#d6e2ef}</style><div class="box"><h1>تحديث مالي إلى V8.3</h1><p>إذا بقيت الواجهة القديمة، استخدم التحديث هنا. تُزال نسخة ملفات التطبيق القديمة فقط؛ تبقى مدخلاتك المالية المحفوظة.</p><button class="secondary" id="backup">تنزيل نسخة احتياطية من بياناتي</button><button id="update">تحديث وفتح مالي</button><small>يحتاج اتصالًا بالإنترنت. لا تستخدم «مسح بيانات الموقع».</small><div id="status" role="status" aria-live="polite"></div></div><script>
const status=document.getElementById('status');
document.getElementById('backup').onclick=()=>{try{let raw=localStorage.getItem('mali-v4');if(!raw){status.textContent='لا توجد بيانات محفوظة في هذا المتصفح.';return}JSON.parse(raw);let blob=new Blob([raw],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mali-before-update.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status.textContent='تم طلب تنزيل النسخة الاحتياطية.'}catch(e){status.textContent='تعذر تصدير البيانات؛ لم تتغير مدخلاتك.'}};
document.getElementById('update').onclick=async()=>{let button=document.getElementById('update');button.disabled=true;status.textContent='جارٍ تحميل النسخة الجديدة…';try{let root=new URL('./',location.href);let latest=new URL('index.html',root);latest.searchParams.set('refresh',Date.now());let response=await fetch(latest,{cache:'no-store'});if(!response.ok)throw Error('تعذر الوصول للموقع');let html=await response.text();if(!html.includes('app.js?v=8.3'))throw Error('النسخة V8.3 لم تنشر بعد؛ ارفع محتويات الحزمة كاملة أولًا');if('serviceWorker' in navigator){let registrations=await navigator.serviceWorker.getRegistrations();for(let registration of registrations){let worker=registration.active||registration.waiting||registration.installing;if(registration.scope===root.href&&worker&&new URL(worker.scriptURL).pathname===new URL('sw.js',root).pathname)await registration.unregister()}}if('caches' in window){let names=await caches.keys();for(let name of names)if(/^mali-v/.test(name))await caches.delete(name)}status.textContent='تم التحديث؛ جارٍ فتح مالي ببياناتك المحفوظة…';location.replace(latest.href)}catch(e){status.textContent=e.message+'؛ لم نحذف بياناتك.';button.disabled=false}};
</script></html>
